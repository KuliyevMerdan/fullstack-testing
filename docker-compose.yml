name: catalog

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  S3_BUCKET: ${S3_BUCKET}
  MEDIA_BASE_URL: /media
  SERVICE_TOKEN: ${SERVICE_TOKEN}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        cat > /tmp/policy.json <<EOF
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":["*"]},
          "Action":["s3:GetObject"],"Resource":["arn:aws:s3:::$$S3_BUCKET/*"]}]}
        EOF
        mc anonymous set-json /tmp/policy.json "local/$$S3_BUCKET"
    restart: "no"

  migrate:
    build: ./backend
    image: catalog/backend:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    image: catalog/backend:dev
    restart: unless-stopped
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./web
    image: catalog/web:dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    deploy:
      replicas: 2
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build: ./bot
    image: catalog/bot:dev
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      PUBLIC_URL: ${PUBLIC_URL}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      ADMIN_IDS: ${ADMIN_IDS}
      API_INTERNAL_URL: http://api:8000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
    depends_on:
      - api
    deploy:
      replicas: 2
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - api
      - web
      - minio

  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://nginx:80"]
    depends_on:
      - nginx

volumes:
  pg-data:
  minio-data:
